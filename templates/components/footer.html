{% component footer(name, contact="contact@theokrueger.dev",
source="https://gitlab.com/theokrueger/website") %}
<!-- unanchored page footer -->
<p id="footer-bottom-text">
  <a href="mailto:{{ contact }}"><t class="rotate-180">©</t>theokrueger</a> |
  <a href="{{ source }}" target="_blank">view source</a>
</p>

<!-- anchored footer -->
<div id="footer-bottom-spacer"></div>
<div id="footer">
  <span class="top"></span>
  <span class="accent"></span>
  <span class="top"></span>
  <span class="top"></span>
  <p style="margin-right: 1em; align-self: center;">U:%%@</p>
  <button id="nav-toggler" popovertarget="nav-menu" class="hoverable">
    {% if name %}{{ name }}{% else %}Scratch{% endif %} ^
  </button>
  <a
    style="margin-left: 1em; align-self: center;"
    id="nav-scroll-progress"
    href="#title"
    class="hoverable"
    >top</a
  >
  <p></p>

  <span class="bottom"></span>
  <span class="accent"></span>
  <span class="bottom"></span>
  <span class="bottom"></span>
</div>
<!-- navlist -->
<div popover id="nav-menu">
  <ul>
    {# zola internal linking does not work outside of MD #}
    <li><a href="/">home</a></li>
    <li><a href="/micro/">micro</a></li>
    <li><a href="/posts/">posts</a></li>
    <li><a href="/portfolio/">portfolio</a></li>
  </ul>
</div>
{% endcomponent footer %}
