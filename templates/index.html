{% extends "root.html" %}

{% block body %}
{{ <body.base slideshow={page?.extra?.extern?.slideshow or section?.extra?.extern?.slideshow or false}/> }}
{% endblock body %}

{% block content %}

{{ <title title={section.title} subtitle={section.description} subsubtitle={section.extra.subsubtitle} flavor_id={section.extra.flavor_id} show_rss={false} /> }}

<div id="content">
  {{ section.content | safe }}
</div>

{{ <footer name={section.extra.footer_name} /> }}
{% endblock content %}
