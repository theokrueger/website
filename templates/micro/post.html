{% extends "root.html" %}
{% import "components/mod.html" as macros %}

{% block body %}
{{ body::micro() }}
{% endblock %}


{% block content %}
<div id="acl">
  <!-- navigation -->
  <div id="acl-nav">
    <a href="/micro/"><img src="/micro/acl/logo_header.gif"></a>
  </div>
  <div id="acl-profile">
    <h1 id="acl-info-username" style="margin: 0; text-align: center;">{{ page.title }}</h1>
    <div id="acl-info-bio" style="text-align: center;">{{ page.description }}</div>
    <p id="acl-info-bio" style="text-align: center;">
      <a href="{{ page.permalink }}">{{ page.date }}</a> - theokrueger
    </p>
    <div style="padding: 0 2.5%;">
      {{ page.content | safe }}
    </div>
  </div>
</div>
{% endblock content %}
