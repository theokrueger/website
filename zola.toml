base_url = "https://theokrueger.dev"
title = "theokrueger.dev"
description = "the occasional thoughtless muse"
default_language = "en"
author = "theokrueger"

# compile/pack
generate_sitemap = true
generate_robots_txt = true
compile_sass = true
minify_html = true
build_search_index = false
exclude_paginated_pages_in_sitemap = "all"
generate_feeds = false
feed_filenames = ["atom.xml", "rss.xml"]
feed_limit = 10
taxonomy_root = "posts"
ignored_content = []
ignored_static = []

[markdown]
bottom_footnotes = true
render_emoji = false
external_links_class = "external-link"
external_links_target_blank = true
external_links_no_referrer = true
external_links_no_follow = true
external_links_external = true
smart_punctuation = false

[markdown.highlighting]
theme = "catppuccin-macchiato"
error_on_missing_language = true

[search]
include_title = true

[extra]
source = "https://gitlab.com/theokrueger/website"
contact = "contact@theokrueger.dev"
